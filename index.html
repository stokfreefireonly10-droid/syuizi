<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifikasi Email - Syuizi</title>
<style>
:root{--r:#ff2e3d;--r2:#b3001b;--bg:#050203}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;position:relative}
body:before,body:after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;animation:fl 9s ease-in-out infinite alternate}
body:before{background:var(--r2);top:-120px;left:-100px}
body:after{background:#ff2e3d55;bottom:-140px;right:-100px;animation-delay:-4s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
.card{position:relative;z-index:1;width:100%;max-width:400px;text-align:center;padding:34px 24px;border-radius:22px;background:linear-gradient(160deg,#1a0709ee,#0b0305ee);border:1px solid #ff2e3d55;box-shadow:0 0 40px #ff2e3d33,inset 0 0 30px #ff2e3d10}
.logo{font-size:26px;font-weight:800;letter-spacing:1px;color:var(--r);text-shadow:0 0 18px #ff2e3dcc;margin-bottom:22px}
.ic{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#ff2e3d33,transparent 70%);border:2px solid #ff2e3d88;box-shadow:0 0 28px #ff2e3d66}
.ic svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:21px;margin-bottom:8px}
p{font-size:14px;line-height:1.55;color:#d9b8bc;margin-bottom:22px}
.btn{display:block;width:80%;margin:0 auto;padding:14px;border:0;border-radius:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,#ff2e3d,#b3001b);box-shadow:0 0 22px #ff2e3d77;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.94);box-shadow:0 0 8px #ff2e3d55}
.btn[disabled]{opacity:.6}
.err{color:#ff8a93;font-size:13px;margin-top:14px;min-height:18px}
.ok .ic{background:radial-gradient(circle,#ff2e3d55,transparent 70%);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.ok .ic path{stroke-dasharray:40;stroke-dashoffset:40;animation:dr .5s .35s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes dr{to{stroke-dashoffset:0}}
.hide{display:none}
.sp{width:20px;height:20px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:middle;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<div class="card" id="card">
  <div class="logo">SYUIZI</div>
  <div class="ic"><svg viewBox="0 0 24 24" id="icon"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
  <h1 id="t">Konfirmasi Email Kamu</h1>
  <p id="d">Satu langkah lagi! Tekan tombol di bawah untuk memverifikasi email dan mengaktifkan akun Syuizi kamu.</p>
  <button class="btn" id="go" onclick="verif()">Verifikasi Sekarang</button>
  <a class="btn hide" id="open" href="https://syuizipenghasiluang.vercel.app/">Buka Syuizi</a>
  <div class="err" id="e"></div>
</div>
<script>
// === ISI SESUAI PROYEK SUPABASE KAMU (sudah terisi sama seperti Syuizi.html) ===
const SB_URL="https://plipnuzrlcfnciqgttpl.supabase.co";
const SB_KEY="sb_publishable_jmUR3WyikCP2bT6j-IszEQ_nDipIxPt";
const SITE="https://syuizipenghasiluang.vercel.app/";
// ================================================================================
const q=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
const th=q.get("token_hash")||q.get("token");
const type=q.get("type")||"signup";
if(!th){$("e").textContent="Link verifikasi tidak lengkap. Buka lagi dari tombol di email.";$("go").disabled=true}
async function verif(){
  const b=$("go");b.disabled=true;b.innerHTML='<span class="sp"></span>';$("e").textContent="";
  try{
    const r=await fetch(SB_URL+"/auth/v1/verify",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({type:type,token_hash:th})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.msg||j.error_description||j.message||"Link kedaluwarsa atau sudah dipakai");
    $("card").classList.add("ok");
    $("icon").innerHTML='<path d="M5 12.5l4.5 4.5L19 7.5"/>';
    $("t").textContent="Verifikasi Berhasil!";
    $("d").textContent="Email kamu sudah terverifikasi. Akun Syuizi aktif, silakan masuk dan mulai kerjakan tugas.";
    b.classList.add("hide");$("open").classList.remove("hide");
    setTimeout(()=>{location.href=SITE},4000);
  }catch(x){
    b.disabled=false;b.textContent="Coba Lagi";
    $("e").textContent=x.message;
  }
}
</script></body></html>
